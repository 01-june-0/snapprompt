<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<title>SnapPrompt · store graphics</title>
<style>
  :root{
    --v400:#A78BFA;--v500:#8B5CF6;--v600:#7C3AED;--v700:#6D28D9;--v900:#4C1D95;
    --font:'Pretendard',-apple-system,BlinkMacSystemFont,'SF Pro Text','Segoe UI',Roboto,Arial,sans-serif;
    --mono:ui-monospace,SFMono-Regular,'JetBrains Mono',Menlo,Consolas,monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{width:100%;height:100%}
  body{font-family:var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
  .frame{display:none;align-items:center;justify-content:center;position:relative;overflow:hidden}
  .frame.active{display:flex}

  /* deep violet promo background with soft glow (fully opaque → no alpha) */
  .promo-bg{
    background:
      radial-gradient(900px 500px at 18% -10%, rgba(167,139,250,.45), transparent 60%),
      radial-gradient(700px 500px at 110% 120%, rgba(244,114,182,.28), transparent 55%),
      linear-gradient(135deg,#7C3AED 0%, #5B21B6 55%, #3B0A6B 100%);
    color:#fff;
  }

  /* lightning mark tile */
  .mark{background:linear-gradient(135deg,var(--v400),var(--v700));display:grid;place-items:center;
    box-shadow:0 18px 40px -12px rgba(0,0,0,.5), inset 0 1px 0 rgba(255,255,255,.25)}
  .mark.flat{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.28);box-shadow:none;backdrop-filter:blur(4px)}

  .wordmark{font-weight:800;letter-spacing:-.02em}
  .tagline{opacity:.92;font-weight:500}
  .chips{display:flex;gap:10px;flex-wrap:wrap}
  .chip{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.22);border-radius:999px;
    font-weight:600;display:inline-flex;align-items:center;gap:7px}

  /* ===== STORE ICON 128 (rounded, transparent corners kept) ===== */
  #icon{width:128px;height:128px;background:transparent}
  #icon .ico{width:128px;height:128px;border-radius:28px;background:linear-gradient(140deg,#9265F5,#6D28D9 70%,#5B21B6);
    display:grid;place-items:center;box-shadow:inset 0 2px 0 rgba(255,255,255,.25)}

  /* ===== SMALL PROMO 440x280 ===== */
  #small{width:440px;height:280px}
  #small .wrap{display:flex;flex-direction:column;align-items:center;text-align:center;gap:16px;padding:0 32px}
  #small .mark{width:74px;height:74px;border-radius:20px}
  #small .wordmark{font-size:34px}
  #small .tagline{font-size:15px;line-height:1.5;max-width:330px}

  /* ===== MARQUEE 1400x560 ===== */
  #marquee{width:1400px;height:560px}
  #marquee .row{display:flex;align-items:center;width:100%;height:100%;padding:0 90px;gap:60px}
  #marquee .left{flex:1;display:flex;flex-direction:column;gap:24px}
  #marquee .brand{display:flex;align-items:center;gap:20px}
  #marquee .mark{width:88px;height:88px;border-radius:24px}
  #marquee .wordmark{font-size:62px}
  #marquee .tagline{font-size:24px;line-height:1.45;max-width:560px}
  #marquee .chip{font-size:16px;padding:10px 16px}
  #marquee .right{flex:0 0 460px;display:flex;justify-content:center}

  /* mini popup mock for the marquee right side */
  .mock{width:420px;background:#fff;border-radius:18px;box-shadow:0 40px 90px -20px rgba(0,0,0,.55);overflow:hidden;color:#0F172A}
  .mock-h{display:flex;align-items:center;gap:9px;padding:14px 16px;border-bottom:1px solid #E2E8F0}
  .mock-mk{width:26px;height:26px;border-radius:8px;background:linear-gradient(135deg,var(--v500),var(--v700));display:grid;place-items:center}
  .mock-nm{font-weight:700;font-size:15px}
  .mock-srch{margin:14px 16px;height:38px;border-radius:9px;background:#F1F5F9;display:flex;align-items:center;padding:0 14px;color:#64748B;font-size:13px;gap:8px}
  .mock-row{display:flex;align-items:center;gap:10px;padding:11px 16px;margin:0 8px;border-radius:10px}
  .mock-row.on{background:#F5F3FF}
  .mock-ic{width:30px;height:30px;border-radius:8px;background:#EDE9FE;color:var(--v700);display:grid;place-items:center;flex-shrink:0;font-size:15px}
  .mock-t{font-weight:600;font-size:13.5px}
  .mock-p{font-size:11.5px;color:#94A3B8;margin-top:2px}
  .mock-vb{margin-left:auto;font-size:10px;font-weight:700;color:var(--v700);background:#EDE9FE;padding:2px 7px;border-radius:5px}
  .mock-foot{height:42px;margin:8px;border-radius:10px;background:linear-gradient(135deg,var(--v500),var(--v700));color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:13px;gap:6px}
</style>
</head>
<body>

<!-- store icon 128 -->
<div class="frame" id="icon">
  <div class="ico">
    <svg width="74" height="74" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linejoin="round"><path d="M6 3h12l-2 8 4 5-7-2-7 4 2-9-4-4z" fill="rgba(255,255,255,.12)"/></svg>
  </div>
</div>

<!-- small promo 440x280 -->
<div class="frame promo-bg" id="small">
  <div class="wrap">
    <div class="mark"><svg width="42" height="42" viewBox="0 0 24 24" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l-2 8 4 5-7-2-7 4 2-9-4-4z"/></svg></div>
    <div class="wordmark">SnapPrompt</div>
    <div class="tagline">발견한 프롬프트를 스냅 —<br/>어디서든 단축키로 꺼내 변수까지 채워 삽입</div>
  </div>
</div>

<!-- marquee promo 1400x560 -->
<div class="frame promo-bg" id="marquee">
  <div class="row">
    <div class="left">
      <div class="brand">
        <div class="mark"><svg width="50" height="50" viewBox="0 0 24 24" fill="rgba(255,255,255,.15)" stroke="#fff" stroke-width="2" stroke-linejoin="round"><path d="M6 3h12l-2 8 4 5-7-2-7 4 2-9-4-4z"/></svg></div>
        <div class="wordmark">SnapPrompt</div>
      </div>
      <div class="tagline">발견한 LLM 프롬프트를 저장하고, 어떤 입력창에서든 단축키로 꺼내 변수까지 채워 삽입하는 프롬프트 매니저.</div>
      <div class="chips">
        <span class="chip">⚡ 단축키 삽입</span>
        <span class="chip">🧩 변수 템플릿</span>
        <span class="chip">🖼 이미지·영상 옵션</span>
        <span class="chip">🔒 로컬 저장</span>
      </div>
    </div>
    <div class="right">
      <div class="mock">
        <div class="mock-h"><div class="mock-mk"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linejoin="round"><path d="M6 3h12l-2 8 4 5-7-2-7 4 2-9-4-4z"/></svg></div><div class="mock-nm">SnapPrompt</div></div>
        <div class="mock-srch"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>프롬프트 검색…</div>
        <div class="mock-row on"><div class="mock-ic">🖼</div><div><div class="mock-t">로고 디자인 (Midjourney)</div><div class="mock-p">{{스타일}} 로고, 컨셉 {{컨셉}} --ar 1:1</div></div><span class="mock-vb">3 vars</span></div>
        <div class="mock-row"><div class="mock-ic">⌨</div><div><div class="mock-t">코드 리뷰 (한국어)</div><div class="mock-p">{{언어}}로 보안·성능·가독성 리뷰…</div></div><span class="mock-vb">2 vars</span></div>
        <div class="mock-foot">＋ 새 프롬프트</div>
      </div>
    </div>
  </div>
</div>

<script>
  const shot = location.hash.replace('#','') || 'small';
  const el = document.getElementById(shot);
  if (el) el.classList.add('active');
</script>
</body>
</html>
